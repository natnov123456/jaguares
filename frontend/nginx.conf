# JAG-77: sirve la aplicación React. Las rutas del cliente (/cursos, /admin/...) vuelven a index.html.
# Es una plantilla: al iniciar, nginx reemplaza ${URL_BACKEND} por la dirección del backend (variable de entorno).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # No anunciar la versión de nginx
  server_tokens off;

  # Cabeceras de seguridad (se repiten en cada location porque add_header de un location reemplaza las del server).
  # CSP: solo scripts propios; la API, imágenes y videos solo desde los orígenes permitidos.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: ${URL_BACKEND}; font-src 'self' data:; connect-src 'self' ${URL_BACKEND}; media-src 'self' blob: ${URL_BACKEND}; frame-src blob: https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }
}
