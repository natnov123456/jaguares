# Despliegue del microservicio backend (jaguares_backend) en Render, plan gratuito.
# Render compila backend/Dockerfile desde GitHub y vuelve a desplegar en cada push que cambie backend/.
# La base de datos PostgreSQL está en Neon (gratuita): su cadena se carga en el panel de Render
# como ConnectionStrings__Default (no se sube al repositorio).
services:
  - type: web
    name: jaguares-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: App__FrontendUrl
        value: https://jaguares-front.onrender.com
      - key: Proxy__Confiable
        value: "true"
      # Correo: Gmail con contraseña de aplicación (Smtp__Usuario y Smtp__Password se cargan en el panel)
      - key: Smtp__Host
        value: smtp.gmail.com
      - key: Smtp__Puerto
        value: "587"
      - key: Smtp__UsarSsl
        value: "true"
      - key: Smtp__Usuario
        sync: false
      - key: Smtp__Password
        sync: false

  # Microservicio frontend (jaguares_front): sitio React estático en la CDN de Render (gratis, no se duerme).
  # Vuelve a publicarse en cada push que cambie frontend/.
  - type: web
    name: jaguares-front
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Dirección pública del backend en Render
      - key: VITE_SERVIDOR
        value: https://jaguares-backend-6mjz.onrender.com
    # Rutas de React (/cursos, /admin/...) → index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
