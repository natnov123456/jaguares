# Despliegue del microservicio backend (jaguares_backend) en Render, plan gratuito.
# Render compila backend/Dockerfile desde GitHub y vuelve a desplegar en cada push que cambie backend/.
# La base de datos PostgreSQL está en Neon (gratuita): su cadena se carga en el panel de Render
# como ConnectionStrings__Default (no se sube al repositorio).
services:
  - type: web
    name: jaguares-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: App__FrontendUrl
        value: https://jaguares-front.onrender.com
      - key: Proxy__Confiable
        value: "true"
      # Seguridad: redirige HTTP a HTTPS y bloquea tras intentos fallidos de inicio de sesión
      - key: Seguridad__ForzarHttps
        value: "true"
      # Correo: Brevo por el puerto 2525 (el plan gratis de Render bloquea 25, 465 y 587).
      # Smtp__Usuario, Smtp__Password y Smtp__Remitente (correo verificado en Brevo) se cargan en el panel
      - key: Smtp__Host
        value: smtp-relay.brevo.com
      - key: Smtp__Puerto
        value: "2525"
      - key: Smtp__UsarSsl
        value: "true"
      - key: Smtp__Usuario
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__Remitente
        sync: false

  # Microservicio frontend (jaguares_front): sitio React estático en la CDN de Render (gratis, no se duerme).
  # Vuelve a publicarse en cada push que cambie frontend/.
  - type: web
    name: jaguares-front
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Dirección pública del backend en Render
      - key: VITE_SERVIDOR
        value: https://jaguares-backend-6mjz.onrender.com
    # Rutas de React (/cursos, /admin/...) → index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Cabeceras de seguridad. CSP: solo scripts propios; la API, imágenes y videos solo desde orígenes permitidos
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://jaguares-backend-6mjz.onrender.com; media-src 'self' blob: https://jaguares-backend-6mjz.onrender.com; frame-src blob: https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
